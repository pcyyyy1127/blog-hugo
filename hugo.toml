baseURL = "https://your-domain.com/"
languageCode = "zh-CN"
title = "XiNing-tech"
theme = "hugo-narrow"

# 归档页从这些 section 拉取文章（不设则可能为空）
mainSections = ["posts"]

[params]
description = "XiNing-tech 的技术与随笔"
defaultAuthor = "XiNing-tech"

# 主题配色与头部控件（与主题示例一致，才能出现调色板、暗色模式等效果）
colorScheme = "Amethyst"

[params.header]
sticky = true
showThemeSwitch = true
showDarkModeSwitch = true
showLanguageSwitch = true
languageSwitchMode = "dropdown"

[params.header.logo]
image = "/images/logo.png"
link = "/"

# 可选的主题风格列表（调色板下拉菜单用）
[params.themes]
default = { name = "Default", order = 1 }
bumblebee = { name = "Bumblebee", order = 3 }
emerald = { name = "Emerald", order = 4 }
nord = { name = "Nord", order = 5 }
sunset = { name = "Sunset", order = 6 }
abyss = { name = "Abyss", order = 7 }
dracula = { name = "Dracula", order = 8 }
amethyst = { name = "Amethyst", order = 9 }
slate = { name = "Slate", order = 10 }

[params.author]
name = "XiNing-tech"
avatar = "/images/logo.png"
title = "前端开发者"
description = "前端开发者，熟悉 Vue、React、React Native、UniApp、TypeScript 等技术栈，分享前端技术与实践。"

[[params.author.social]]
name = "GitHub"
url = "https://github.com/pcyyyy1127"
icon = "github"

[[params.author.social]]
name = "掘金"
url = "https://juejin.cn/user/3507861093628140"
icon = "external-link"

[[params.author.social]]
name = "CSDN"
url = "https://blog.csdn.net/ParkChanyelo"
icon = "external-link"

[params.social]
github = "https://github.com/pcyyyy1127"
twitter = "https://twitter.com/XiNing_tech"
linkedin = "https://linkedin.com/in/xining-tech"

# 评论（Giscus：GitHub Discussions）
[params.comments]
enabled = true
system = "giscus"
[params.comments.giscus]
repo = "pcyyyy1127/blog-hugo"
repoId = "R_kgDORGvhIw"
category = "General"
categoryId = "DIC_kwDORGvhI84C10lH"
mapping = "pathname"
strict = "0"
reactionsEnabled = "1"
emitMetadata = "0"
inputPosition = "bottom"
theme = "preferred_color_scheme"
lang = "zh-CN"
# Utterances：用 GitHub Issues，备选。repo 填 "用户名/仓库名" 即可
[params.comments.utterances]
repo = ""
issueTerm = "pathname"
label = "comment"
theme = "preferred-color-scheme"


[menu]
[[menu.main]]
identifier = "home"
name = "首页"
url = "/"
weight = 1

[[menu.main]]
identifier = "archives"
name = "归档"
url = "/archives/"
weight = 2

[[menu.main]]
identifier = "categories"
name = "分类"
url = "/categories/"
weight = 3

[[menu.main]]
identifier = "tags"
name = "标签"
url = "/tags/"
weight = 4

