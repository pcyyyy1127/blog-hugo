baseURL = "https://your-domain.com/"
languageCode = "zh-CN"
title = "前端开发者个人网站"
theme = "hugo-narrow"

[params]
description = "记录前端开发学习与实践"

# 主题配色与头部控件（与主题示例一致，才能出现调色板、暗色模式等效果）
colorScheme = "Amethyst"

[params.header]
sticky = true
showThemeSwitch = true
showDarkModeSwitch = true
showLanguageSwitch = true
languageSwitchMode = "dropdown"

[params.header.logo]
image = ""
link = "/"

# 可选的主题风格列表（调色板下拉菜单用）
[params.themes]
default = { name = "Default", order = 1 }
bumblebee = { name = "Bumblebee", order = 3 }
emerald = { name = "Emerald", order = 4 }
nord = { name = "Nord", order = 5 }
sunset = { name = "Sunset", order = 6 }
abyss = { name = "Abyss", order = 7 }
dracula = { name = "Dracula", order = 8 }
amethyst = { name = "Amethyst", order = 9 }
slate = { name = "Slate", order = 10 }

[params.author]
name = "前端开发者"
avatar = ""

[params.social]
github = "https://github.com/your-username"
twitter = "https://twitter.com/your-username"
linkedin = "https://linkedin.com/in/your-username"

[menu]
[[menu.main]]
identifier = "home"
name = "首页"
url = "/"
weight = 1

[[menu.main]]
identifier = "archives"
name = "归档"
url = "/archives/"
weight = 2

[[menu.main]]
identifier = "categories"
name = "分类"
url = "/categories/"
weight = 3

[[menu.main]]
identifier = "tags"
name = "标签"
url = "/tags/"
weight = 4
